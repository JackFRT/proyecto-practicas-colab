<footer class="font-['Montserrat'] border-t pt-16 md:pt-20 px-6 sm:px-[5%] pb-10 relative z-10 transition-colors duration-500"
        [ngClass]="themeService.isDarkMode()
          ? 'bg-[#050505] text-white border-white/10'
          : 'bg-[#ebe2d0] text-[#1a281f] border-[#8c583a]/20'">
    <div class="max-w-[1400px] mx-auto grid grid-cols-1 md:grid-cols-[2fr_1fr_1fr] gap-10 md:gap-16 mb-14 md:mb-20 text-center md:text-left">

        <!-- MARCA -->
        <div class="flex flex-col justify-center items-center md:items-start">
            <h1 class="text-4xl sm:text-[2.8rem] md:text-[3.5rem] font-black leading-none tracking-[-2px] m-0 mb-3">CAFÉ<br>AYACUCHANO</h1>
            <p class="text-[0.75rem] md:text-[0.9rem] font-extrabold tracking-[2px] md:tracking-[4px] m-0 uppercase"
               [ngClass]="themeService.isDarkMode() ? 'text-[#d1b88e]' : 'text-[#8c583a]'">MÁS QUE UN CAFÉ... UN MUSEO DE CACTUS</p>
        </div>

        <div class="flex flex-col items-center md:items-start">
            <h2 class="text-base sm:text-lg font-extrabold m-0 mb-4 tracking-[2px] uppercase">CONTACTO</h2>
            <div class="w-[50px] h-[2px] bg-[#d1b88e] mb-6"></div>

            <div class="flex flex-col gap-3.5 text-[0.92rem] font-medium opacity-80">
                <p class="m-0 flex items-center justify-center md:justify-start gap-3">
                    <i class="fas fa-envelope w-5 text-center"></i> henrycactus&#64;hotmail.com
                </p>
                <p class="m-0 flex items-center justify-center md:justify-start gap-3">
                    <i class="fab fa-whatsapp w-5 text-center"></i> +51 981 851 430
                </p>
                <p class="m-0 flex items-center justify-center md:justify-start gap-3">
                    <i class="fas fa-map-marker-alt w-5 text-center"></i> Jr. San Cristóbal, Ayacucho, Perú
                </p>
            </div>
        </div>

        <div class="flex flex-col items-center md:items-start">
            <h2 class="text-base sm:text-lg font-extrabold m-0 mb-4 tracking-[2px] uppercase">SÍGUENOS</h2>
            <div class="w-[50px] h-[2px] bg-[#d1b88e] mb-6"></div>

            <div class="flex gap-4">
                <a href="https://www.instagram.com/caffeayacuchano/" target="_blank"
                   class="w-[46px] h-[46px] flex items-center justify-center border rounded-full text-lg no-underline transition-all duration-300 hover:bg-[#d1b88e] hover:text-black hover:border-[#d1b88e] hover:-translate-y-1 shadow-md"
                   [ngClass]="themeService.isDarkMode() ? 'border-white/20 bg-white/5 text-white' : 'border-[#8c583a]/30 bg-white/70 text-[#1a281f]'">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.facebook.com/cafeayacuchano/" target="_blank"
                   class="w-[46px] h-[46px] flex items-center justify-center border rounded-full text-lg no-underline transition-all duration-300 hover:bg-[#d1b88e] hover:text-black hover:border-[#d1b88e] hover:-translate-y-1 shadow-md"
                   [ngClass]="themeService.isDarkMode() ? 'border-white/20 bg-white/5 text-white' : 'border-[#8c583a]/30 bg-white/70 text-[#1a281f]'">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="https://www.tiktok.com/@caf.ayacuchano0" target="_blank"
                   class="w-[46px] h-[46px] flex items-center justify-center border rounded-full text-lg no-underline transition-all duration-300 hover:bg-[#d1b88e] hover:text-black hover:border-[#d1b88e] hover:-translate-y-1 shadow-md"
                   [ngClass]="themeService.isDarkMode() ? 'border-white/20 bg-white/5 text-white' : 'border-[#8c583a]/30 bg-white/70 text-[#1a281f]'">
                    <i class="fab fa-tiktok"></i>
                </a>
            </div>
        </div>
    </div>

    <div class="max-w-[1400px] mx-auto flex flex-col md:flex-row justify-between items-center pt-8 border-t text-[0.7rem] md:text-[0.8rem] font-extrabold tracking-[1px] opacity-60 gap-5"
         [ngClass]="themeService.isDarkMode() ? 'border-white/10' : 'border-[#8c583a]/20'">
        <p class="m-0 text-center md:text-left">&copy; 2026 CAFÉ AYACUCHANO & CACTUS MUSEUM. TODOS LOS DERECHOS RESERVADOS.</p>
        <div class="flex items-center gap-4 flex-wrap justify-center">
            <a href="#" class="no-underline transition-colors hover:text-[#d1b88e] inherit">Términos y Condiciones</a>
            <span>•</span>
            <a href="#" class="no-underline transition-colors hover:text-[#d1b88e] inherit">Política de Privacidad</a>
        </div>
    </div>
</footer>
