<div class="ruleta-modal-overlay" (click)="cerrarModal()">
    
    <div class="ruleta-glass-container" (click)="$event.stopPropagation()">
        
        <button class="close-modal-x" (click)="cerrarModal()">&times;</button>

        <div class="ruleta-header">
            <h2><i class="fas fa-dharmachakra spin-icon"></i> RULETA SEMANAL DE MOKA</h2>
            <p>Un giro cada semana. ¡Gana descuentos para tu próxima adopción!</p>
        </div>

        @if (userRole === 'empleado') {
            <div style="background: rgba(255,255,255,0.1); color: #FFE066; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-weight: bold; border: 1px dashed rgba(255, 224, 102, 0.4); margin-left: 20px; margin-right: 20px;">
                <i class="fas fa-eye"></i> Vista de Empleado (Giro Deshabilitado)
            </div>
        }

        <div class="ruleta-body-grid">
            <div class="moka-panel">
                <div class="moka-bubble" [style.background]="mokaColor" [style.borderColor]="mokaColor.replace('0.2', '0.5').replace('0.15', '0.5').replace('0.1', '0.3')">
                    <i class="fas fa-quote-left quote-mark"></i>
                    {{ mokaMensaje }}
                </div>
                <img [src]="'/assets/images/barista/' + mokaImagen" alt="Moka" class="moka-img">
            </div>

            <div class="wheel-panel">
                <div class="wheel-result-box">
                    <span>RESULTADO:</span>
                    <strong [style.color]="resultadoColor" [class.glowing]="!isGirando && (haGirado || userRole === 'empleado')">{{ resultadoTexto }}</strong>
                </div>

                <div class="wheel-interactive-area" (click)="girar()">
                    <div class="wheel-pointer"><i class="fas fa-caret-right"></i></div>
                    
                    <div class="canvas-wrapper" [class.disabled]="(haGirado && !isGirando) || userRole === 'empleado'">
                        <canvas #wheelCanvas width="300" height="300" 
                                [style.transform]="'rotate(' + rotacionActual + 'deg)'"
                                class="wheel-canvas"></canvas>
                        
                        <div class="wheel-center-btn">
                            <i class="fas fa-leaf"></i>
                        </div>
                    </div>
                </div>
                
                @if (userRole !== 'empleado') {
                    <p class="wheel-hint">¡HAZ CLIC EN LA RUEDA PARA GIRAR!</p>
                }
            </div>
        </div>
    </div>
</div>
